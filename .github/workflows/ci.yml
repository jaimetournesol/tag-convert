name: TAG toolkit checks
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: docker build -f docker/Dockerfile -t tag-convert:test .
      - run: python3 tests/smoke-stdio.py docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges tag-convert:test
