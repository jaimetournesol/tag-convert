name: Publish TAG toolkit
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify version and tests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'if ("v"+JSON.parse(require("fs").readFileSync("scripts/package.json")).version!==process.env.RELEASE_TAG) process.exit(1)'
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test both platforms before publishing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --platform "$platform" --load -f docker/Dockerfile -t tag-convert:test .
            python3 tests/smoke-stdio.py docker run --rm -i --platform "$platform" --network none --read-only --cap-drop ALL --security-opt no-new-privileges tag-convert:test
          done
          docker buildx build --platform linux/amd64,linux/arm64 --push -f docker/Dockerfile -t "ghcr.io/jaimetournesol/tag-convert:$RELEASE_TAG" -t ghcr.io/jaimetournesol/tag-convert:latest .
      - name: Publish source installation package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix=tag-convert/ HEAD > tag-convert.tar.gz
          sha256sum tag-convert.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" tag-convert.tar.gz SHA256SUMS --verify-tag --title "TAG toolkit $RELEASE_TAG" --generate-notes
